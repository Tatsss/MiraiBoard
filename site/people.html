<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>国会議員12人 — MiraiBoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<main>
<section class="ph"><div class="w">
  <div class="kick">People</div>
  <h1>国会議員<span class="g">12人</span>。</h1>
  <p class="lead">参議院1人・衆議院11人。一人ずつ、役職、本人のことば、議員室の目標と進み具合、国会での動き、発信をまとめました。写真を押すと詳しく見られます。</p>
</div></section>

<section class="blk" style="border-top:0;padding-top:0"><div class="w">
  <div class="toolbar"><input class="search" id="q" type="search" placeholder="名前・役職・委員会・テーマで探す"><div class="seg" id="f"></div></div>
  <div class="pgrid" id="grid"></div>
  <div style="margin-top:20px" id="lg"></div>
  <div class="src" id="note"></div>
</div></section>

<section class="blk alt"><div class="w">
  <div class="bh"><div class="k">In the Diet</div><div><h2>国会での質疑・発言の数</h2><p>公式サイトのお知らせに載った、委員会・本会議・審査会での質疑や発言の件数です（お知らせが残っている2026年2月以降）。行に触れると、主な委員会が出ます。押すとその議員の詳細が開きます。</p></div></div>
  <div id="bars"></div>
  <div class="src" id="bars-src"></div>
</div></section>
</main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="dtop"><button id="close" aria-label="閉じる">✕</button></div><div class="dbody" id="dbody"></div></aside>
<script src="assets/data.js"></script><script src="assets/common.js"></script>
<script>
chrome('people.html');
$('#lg').innerHTML = legend();
const M = MB.members.members, NEWS = MB.news.items;
const diet = id => NEWS.filter(n => n.kind === '国会' && n.members.includes(id));
const committees = id => { const c = {}; diet(id).forEach(n => { if (n.committee) c[n.committee] = (c[n.committee] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1]); };
const mix = id => { const c = {}; (officeOf(id)?.objectives || []).flatMap(o => o.krs).forEach(k => c[k.status] = (c[k.status] || 0) + 1); return c; };
const ORDER = ['達成', '順調', '注意', '未着手'];

let fv = 'すべて';
function draw() {
  const q = $('#q').value.trim();
  const list = M.filter(m => {
    if (fv === '役職あり' && !roles(m).length) return false;
    if (fv === '衆議院' && !m.house.includes('衆')) return false;
    if (fv === '参議院' && !m.house.includes('参')) return false;
    if (!q) return true;
    return [m.name, m.kana, m.district, ...m.party_roles, m.catchphrase, m.statement, ...committees(m.id).map(c => c[0]), ...(officeOf(m.id)?.objectives || []).map(o => o.title)].join(' ').includes(q);
  });
  $('#grid').innerHTML = list.map(m => { const c = mix(m.id), tot = Object.values(c).reduce((a, b) => a + b, 0) || 1;
    return `<button class="person" data-id="${esc(m.id)}">${photo(m)}<div class="nm">${esc(m.name)}</div><div class="meta">${esc(m.house.replace('議員', ''))}・${esc(m.district)}</div>
    ${roles(m).length ? `<div class="roles">${roles(m).map(r => `<span class="chip b">${esc(r)}</span>`).join('')}</div>` : ''}
    <div class="sbar" aria-label="議員室の目標の状態">${ORDER.filter(s => c[s]).map(s => `<i style="width:${c[s] / tot * 100}%;background:var(--${SC[s]})"></i>`).join('')}</div>
    <div class="small muted" style="margin-top:4px">議員室の目標: ${ORDER.filter(s => c[s]).map(s => `${s}${c[s]}`).join('・')}</div></button>`; }).join('') || '<p class="muted">該当する議員はいません</p>';
}
$('#f').innerHTML = ['すべて', '役職あり', '衆議院', '参議院'].map(v => `<button class="${v === fv ? 'on' : ''}" data-v="${v}">${v}</button>`).join('');
$('#f').onclick = e => { const b = e.target.closest('button'); if (!b) return; fv = b.dataset.v; $$('#f button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
$('#q').oninput = draw; draw();
$('#note').textContent = MB.members.note + '。' + (MB.members.photo_note || '');

/* 国会での質疑・発言（横棒） */
const counts = M.map(m => ({ m, n: diet(m.id).length })).sort((a, b) => b.n - a.n);
const max = Math.max(...counts.map(c => c.n), 1);
$('#bars').innerHTML = counts.map(({ m, n }) => { const top = committees(m.id).slice(0, 3).map(([c, k]) => `${c} ${k}件`).join('<br>') || '—';
  return `<div class="hbar" data-id="${esc(m.id)}" style="cursor:pointer" data-tip="${esc(`<b>${m.name}</b>${top}`)}"><span class="n">${esc(m.name)}</span><span class="t" style="width:${n / max * 100}%"></span><span class="v">${n}</span></div>`; }).join('');
$('#bars-src').innerHTML = '件数はお知らせの見出しから数えたもの。お知らせに載らなかった質疑は含まれません。' + srcHtml(MB.news.source);

/* 詳細（右から開く） */
const drawer = $('#drawer'), scrim = $('#scrim');
function open(id) {
  const m = M.find(x => x.id === id), off = officeOf(id), d = diet(id);
  $('#dbody').innerHTML = `
  <div class="dhero">${photo(m)}<div><div class="kick">${esc(m.house)}・${esc(m.district)}</div><div class="dname">${esc(m.name)}</div><div class="muted small">${esc(m.kana)}</div><div class="roles" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${roles(m).map(r => `<span class="chip b">${esc(r)}</span>`).join('')}</div></div></div>
  <div class="quote">「${esc(m.catchphrase)}」</div><p class="ink2">${esc(m.statement)}</p>
  <div class="dsec"><div class="lbl">議員室の目標と進み具合（OKR ${esc(OKR.period)}）</div>
  ${(off?.objectives || []).map(o => `<div class="obj"><div class="ot">${esc(o.title)}</div>${o.objective ? `<div class="od">${esc(o.objective)}</div>` : ''}${o.krs.map(k => `<div class="krrow"><span>${esc(k.summary)}</span><span style="text-align:right">${st(k.status)}${k.progress ? `<div class="pg">${esc(k.progress)}</div>` : ''}</span></div>`).join('')}</div>`).join('') || '<p>記載なし</p>'}
  ${off ? `<div class="src">${srcHtml({ name: 'チームみらい 公開OKR（議員室）', url: off.source })}</div>` : ''}</div>
  <div class="dsec"><div class="lbl">国会での質疑・発言（お知らせに載ったもの ${d.length}件）</div><div class="kv">${committees(id).map(([c, k]) => `<span class="chip">${esc(c)} ${k}</span>`).join('') || '<span class="muted small">お知らせに記載なし</span>'}</div>
  <ul class="feed">${d.slice(0, 8).map(n => `<li><span class="d">${esc(n.date)}</span><span>${ext(n.url, n.title)}</span></li>`).join('')}</ul>${d.length > 8 ? `<div class="small muted" style="margin-top:6px">ほか${d.length - 8}件は<a class="u" href="timeline.html?m=${esc(id)}">年表</a>で</div>` : ''}</div>
  <div class="dsec"><div class="lbl">プロフィールに載っている最近の活動</div><ul class="feed">${m.recent.map(r => `<li><span class="d">${esc(r.date)}</span><span>${ext(r.url, r.title)} <span class="small muted">${esc(r.kind)}</span></span></li>`).join('') || '<li>直近の公開活動は未確認</li>'}</ul></div>
  <div class="dsec"><div class="lbl">経歴（公式プロフィール）</div><p class="ink2" style="font-size:14px">${esc(m.profile)}</p></div>
  <div class="dsec"><div class="lbl">発信チャンネル</div><div class="links">${m.channels.map(c => `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.kind)}</a>`).join('')}</div></div>
  <div class="dsec"><div class="lbl">出典</div>${m.sources.map(s => `<div class="src" style="margin-top:4px">${srcHtml(s)}</div>`).join('')}<div class="src" style="margin-top:4px">${srcHtml(MB.news.source)}</div></div>`;
  drawer.classList.add('on'); scrim.classList.add('on'); drawer.setAttribute('aria-hidden', 'false'); drawer.scrollTop = 0; history.replaceState(null, '', '#' + id);
}
const close = () => { drawer.classList.remove('on'); scrim.classList.remove('on'); drawer.setAttribute('aria-hidden', 'true'); history.replaceState(null, '', location.pathname); };
$('#grid').onclick = e => { const b = e.target.closest('.person'); if (b) open(b.dataset.id); };
$('#bars').onclick = e => { const b = e.target.closest('.hbar'); if (b) open(b.dataset.id); };
scrim.onclick = close; $('#close').onclick = close; addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
if (location.hash && M.find(m => m.id === location.hash.slice(1))) open(location.hash.slice(1));
</script>
</body></html>
