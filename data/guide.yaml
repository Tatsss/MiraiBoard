# AIインタビューの声が形になった例
examples:
- title: 選挙中のSNSデマ対策
  steps: ['145人の声', '9本の提案', '8本が国の指針案に反映']
  note: 声を聴き始めて約1か月。反映されなかった提案と、必要と考える理由も公開
  source: &kocho_note
    name: note「発足から2ヶ月 広聴本部に寄せられた『声』に答えます！」（2026-11-13）
    url: https://note.com/team_mirai_jp/n/nab7280f54ae4
    checked: '2026-11-25'
- title: AI時代のサイバー対策
  steps: ['1,500人を超える声', '7項目の提言', '10月23日にデジタル大臣に手交']
  note: 11月6日に政府が示した緊急対策パッケージに、提言と同じ方向の施策が入った
  source: *kocho_note
- title: AI失業対策
  steps: ['米国・中国・フランスでの現地調査', 'AIインタビュー582人の声', '10月26日に提言を提出・公開']
  note: 提出の日から、AIインタビューの第2弾で提言への意見を集めている
  source:
    name: YouTube 緊急配信「AI失業対策提言『AIの社会実装と仕事・雇用の変化への備えに向けた提言』について解説します」（2026-10-26。文字起こしで確認）
    url: https://youtu.be/zWKFdgUyFL0
    checked: '2026-11-25'

# 党自身が挙げている、声の扱いの課題
open_questions:
- text: 届けた声の「その後」が見えない（いちばん多く寄せられた声）。声のゆくえを、配送状況のように追える形を目指している
  source: *kocho_note
- text: 答える人が支持者やデジタルに慣れた人に偏るのでは、という指摘がある
  source: *kocho_note
- text: 分析はまだ見本の段階で、仕組みは開発中と説明している
  source:
    name: YouTube「【新設】はじめまして！広聴本部です｜AIインタビュー実演と「Plan C」の生まれ方、目指す新しい民主主義の形」（2026-10-06。文字起こしで確認）
