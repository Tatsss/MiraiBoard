updated: '2026-11-24'
name: チームみらい
summary: 2024年都知事選で安野たかひろのもとに集まった「チーム安野」を前身とする、テクノロジーで政治と未来を良くすることを目指す新党。
summary_source: &id001
  name: チームみらい公式サイト 私たちについて
  url: https://team-mir.ai/about
  checked: '2026-11-24'
leader: 安野貴博（党首・参議院議員）
mission:
- テクノロジーで政治をかえる。
- あなたと一緒に未来をつくる。
vision:
- title: 政治にテクノロジーを
  point: テクノロジーで透明化・効率化・スマート化
- title: 日本に明るい未来を
  point: 新しい産業と文化が生まれ、未来は明るいと信じられる国へ
- title: 変化に対応できる社会を
  point: 激動する世界の変化に耐えられる柔軟なシステムをつくる
values:
- title: 手を動かす
  point: 現場視点で建設的なプランを考え、自らの手で素早く実行する
- title: オープンにする
  point: 意思決定も、お金の流れも、プロセスも透明に
- title: 誰かをおとしめない
  point: 他の政党も政治家も、日本の未来をつくる仲間
- title: 分断を煽らない
  point: 感情ではなく、データと事実で語る
- title: 何事も決めつけない
  point: 多様な声に耳を傾け、より良い答えがあれば柔軟に改善する
