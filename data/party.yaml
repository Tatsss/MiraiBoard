member_role_policy:
  summary: 党が議員に必ず求めるのは、所属する本部のOKRに向けた活動、国会での質疑・政策議論、党が求める情報の公開（調研費、海外視察の報告など）、依頼された党務。地元の行事への出席など特定の地域に根ざした活動は、党として求めていない。
  source:
