roles_explained:
  source:
    name: YouTube「【本人解説】国会対策委員会と政務調査会の役割とは？【チームみらい】」（公開日・URLは未確認。文字起こしで確認）
    url: null
    checked: '2026-11-25'
  items:
  - unit: 国会対策委員会
    what: 国会でどの議案を、いつ、どの委員会で、どの順番で話すかを、各党と事前に話し合って段取りをつける。党の主張が通るよう他党と連携・交渉する
  - unit: 政務調査会
    what: 政策をリードする。マニフェストをもとに政策を考え直し、他党や政府の法案に賛成か反対か、その理由も含めて党のスタンスを決める
  - unit: 2つの関係
    what: 国会対策委員会に入る国会の日程や議題の情報をもとに、政務調査会と一緒に賛否・理由・発言を考える。強い連携が要る
