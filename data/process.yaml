updated: '2026-11-25'
intro: チームみらいは、政策づくりと党の運営を「聴く → 磨く → 動かす → 伝える」のサイクル（デジタル民主主義サイクル）で進めている。ここでは、それぞれの段階で、誰が・何を使って・どんな流れで動いていて、どこまで進み、どこが公開の場で課題として挙がっているかを並べる。
intro_source:
  name: チームみらい OKR（テーマ別の並び）
  url: https://github.com/team-mirai/okr-content/blob/main/2026/q4/issues.yml
  checked: '2026-11-24'
example_flow:
  title: 法案ひとつを、サイクルで扱うときの流れ（党が想定しているもの）
  steps:
  - みらい議会に法案を公開する
  - AIインタビューで声を聴く
  - 声をもとに、賛否と国会での質問を作る
  - みらい議会で、理由とともに公開する
  source:
    name: チームみらい OKR 政務調査会 O2（KR2-2 の補足）
    url: https://github.com/team-mirai/okr-content/blob/main/2026/q4/hq/seicho/o2.yml
    checked: '2026-11-24'
stages:
- key: listen
  tag: 聴く
  title: できるだけ多くの人の声を集める
  officer: 村井謙太
  units:
  - 広聴本部
  - 開発本部
  what: AIが聞き手になるインタビュー（AIインタビュー）で、テーマや法案ごとに匿名で声を集める。みらい議会の法案ページからも入れる。集めた声は分析し、示唆とともに政策をつくる側（政務調査会）や党内の担当に渡す。
  tools:
  - AIインタビュー
  - みらい議会
  facts:
  - text: 2026年10月はAIインタビューを25件実施し、3,902件以上の声が集まった
    source:
      name: チームみらい 月次まとめ 2026年10月
      url: https://team-mir.ai/monthly/2026-10/recap.html
      checked: '2026-11-21'
  - text: 声を集めて政務調査会に渡すまでに、入口（政策LPなど）、集め方、生かし方、記録の伝え方までを追いかける
    source:
      name: チームみらい OKR 広聴本部 O1（KR2 の補足）
      url: https://github.com/team-mirai/okr-content/blob/main/2026/q4/hq/kocho/o1.yml
      checked: '2026-11-24'
  - text: AIインタビューは10分ほど。集まった声はAIが要約して論点ごとに整理し、人はそれを手がかりに一つひとつの声にも目を通す
    source: &id002
      name: note「発足から2ヶ月 広聴本部に寄せられた『声』に答えます！」（2026-11-13）
      url: https://note.com/team_mirai_jp/n/nab7280f54ae4
      checked: '2026-11-25'
  - text: 広聴本部は、声を政策の議論にそのまま使えるところまで整理し、Plan C のたたき台やヒントを出して、政策をつくるチームに渡す
    source: &id001
      name: YouTube「【新設】はじめまして！広聴本部です｜AIインタビュー実演と「Plan C」の生まれ方、目指す新しい民主主義の形」（2026-10-06。文字起こしで確認）
      url: https://youtu.be/4ytOt_jDn7A
      checked: '2026-11-25'
  - text: 広聴本部は2026年9月17日に新設。メンバーは党職員で、議員はいない。それまで「聴く」仕事は開発・広報・政調などに散らばっていた
    source: *id001
  - text: AI失業対策提言では、米国・中国・フランスでの現地調査と、AIインタビュー582人の声をもとに提言を作った。提出の日からAIインタビュー第2弾で、提言への意見を集めている
    source: &id003
      name: YouTube 緊急配信「AI失業対策提言『AIの社会実装と仕事・雇用の変化への備えに向けた提言』について解説します」（2026-10-26。文字起こしで確認）
      url: https://youtu.be/zWKFdgUyFL0
      checked: '2026-11-25'
  public_issues:
  - repo: team-mirai/mirai-gikai
    number: 979
    title: AIインタビューの実行条件と変更履歴を、後から検証できるようにしたい（設計相談）
    date: '2026-09-09'
    url: https://github.com/team-mirai/mirai-gikai/issues/979
    checked: '2026-11-21'
  - repo: team-mirai/mirai-gikai
    number: 1055
    title: みらい議会から入るAIインタビューで、回答済みでも複数回回答できる
    date: '2026-10-25'
    url: https://github.com/team-mirai/mirai-gikai/issues/1055
    checked: '2026-11-21'
  unknown:
  - 広聴本部から政策チームに「何を・どんな形で」渡しているかの具体（大まかな役割分担は動画で説明されているが、受け渡しの手順や形式は公開されていない）
  stated_challenges:
  - text: 届けた声の「その後」が見えない（いちばん多く寄せられた声）。声のゆくえを、配送状況のように追える形を目指している
    source: *id002
  - text: 答える人が支持者やデジタルに慣れた人に偏るのでは、という指摘
    source: *id002
  - text: 分析はまだ見本の段階で、仕組みは開発中
    source: *id001
- key: refine
  tag: 磨く
  title: 集まった声をもとに政策を磨く
  officer: 河合道雄
  units:
  - 政務調査会
  - 広聴本部
  what: 政務調査会が、国民や有識者との熟議をもとに、法案の賛否の判断や重要な政策づくりを行う。全法案の賛否と根拠をみらい議会で公開すること、判断の軸（目的関数）を決めて全法案で運用することを目標にしている。
  tools:
  - みらい議会
  - 政策（マニフェスト）
  facts:
  - text: 法案の賛否は、前段の議論を踏まえて政務調査会長が案と理由を持ってきて、執行役員会で議論し、最後に政務調査会長が理由をまとめてみらい議会に載せる（会議は「まる見えチャンネル」で公開）
    source: &id004
      name: YouTube まる見えチャンネル「執行役員会・法案賛否決定MTG 10月19日」（2026-10-19。文字起こしで確認）
      url: null
      checked: '2026-11-25'
  - text: 政務調査会は政策をリードするチーム。マニフェストをもとに政策の見直しを考え、他党や政府が出した法案に賛成か反対か、その理由も含めて党のスタンスを決める
    source: &id005
      name: YouTube「【本人解説】国会対策委員会と政務調査会の役割とは？【チームみらい】」（公開日・URLは未確認。文字起こしで確認）
      url: null
      checked: '2026-11-25'
  - text: 広聴本部から渡された整理と Plan C のたたき台を、政策チームが専門的に検討して具体案に磨く
    source: *id001
  - text: AI失業とAIサイバー対策の2テーマで、聴く→磨く→提言までを完走した
    source:
      name: チームみらい OKR 政務調査会 O2
      url: https://github.com/team-mirai/okr-content/blob/main/2026/q4/hq/seicho/o2.yml
      checked: '2026-11-24'
  - text: AIサイバー対策緊急提言（2026-10-23）とAI失業対策提言（2026-10-26）を政府に手交
    source:
      name: チームみらいTIMES 10月号
      url: https://team-mir.ai/times/vol01.html
      checked: '2026-11-21'
  - text: 提言は、サポーターのSlackでベータ版をGoogleドキュメントで共有してコメントをもらい、AIインタビューの意見を入れたり外したりして作る
    source: *id003
  public_issues: []
  unknown:
  - 政務調査会の内部での検討の進め方（会議の一部は「まる見えチャンネル」で公開されている）
  stated_challenges:
  - text: ある議員事務所で、生成AIで法案の前提を調べて質問を作る試みはうまくいったが、ほかの11の議員室には広げられなかった（導入の動機を説明できなかった、現場には手間とリスクに見えた）
    source: &id006
      name: YouTube「永田町エンジニアチーム密着」（2026-09-12。文字起こしで確認）
      url: https://youtu.be/0wXNPd3e3fE
      checked: '2026-11-25'
  - text: 執行役員会の法案の議論で、進め方の改善が話された（全文の読み上げより各自で読む時間、意見を事前に書き込む欄）
    source: *id004
  - text: 同じ種類の規定や改正漏れがほかの法律に残っていないか、全法令をAIでスキャンしたいという話が出た（まだ進んでいない）
    source: *id004
- key: act
  tag: 動かす
  title: 磨いた政策で、国会や社会を動かす
  officer: 古川あおい
  units:
  - 国会対策委員会
  - 議員本部
  - 各議員室
  what: 国会での質疑、法案の修正や附帯決議、政府への申し入れで、声を実際の制度に届ける。各議員室は「政府を動かした」事例を、党の共通基準（答弁・附帯決議・回答・政府文書。新規性・具体性・声とのつながり）でつくりにいく。
  tools:
  - AIインタビュー
  - みらい議会
  facts:
  - text: 国会対策委員会は、どの議案をいつ・どの委員会で・どの順番で話すかを各党と事前に調整し、党の主張が通るよう他党と連携・交渉する。政務調査会と強く連携して、賛否や発言を考える
    source: *id005
  - text: 「政府を動かした」と数える条件の一つに、AIインタビューの要旨と、質疑・申し入れ文書の該当箇所を対応づけて記録していることがある
    source:
      name: チームみらい OKR 議員室の共通基準
      url: https://github.com/team-mirai/okr-content/blob/main/2026/q4/giinshitsu/_giinshitsu.yml
      checked: '2026-11-24'
  - text: '提言の内容は国会の質疑で詰めていく（AI失業: 高山聡史が内閣委員会、古川あおいが厚生労働委員会）'
    source: *id003
  - text: サイバー対策では、政府の緊急対策パッケージに、提言22項目のうち14項目と重なる施策が入った。各委員会での質疑に、大臣から「新たな検討課題」「大変参考にさせていただいた」との答弁
    source:
      name: YouTube「【チームみらい】定例会見 (2026年11月13日）」（2026-11-13。文字起こしで確認）
      url: https://note.com/team_mirai_jp/n/n3fd703c9d2a6
      checked: '2026-11-25'
  - text: '国会改革: 議院運営委員会の国会改革小委員会で、本会議でのタブレット利用や残り時間のモニター表示など、短期と中期に分けて提案。「国会の処理能力を10倍に」が目標'
    source:
      name: YouTube「【国会DX】処理能力10倍へ！紙をなくすだけじゃない？目指す5つの国会の姿と道筋」（2026-11-11。文字起こしで確認）
      url: https://youtu.be/s1TvO1hkQ3M
      checked: '2026-11-25'
  public_issues: []
  unknown:
  - 議員事務所の日々の実務（公開情報にはほとんど出てこない）
  stated_challenges:
  - text: SNSデマ対策では145人の声から9本の提案を作り、8本が国の指針案に反映。反映されなかった提案と理由も公開。サイバー対策では1,500人超の声から7項目の提言を作り、政府の緊急対策パッケージに同じ方向の施策が入った（成果の例）
    source: *id002
- key: tell
  tag: 伝える
  title: 結果やプロセスを伝え、次の聴くにつなげる
  officer: 峰島侑也
  units:
  - 広報本部
  - 組織活動本部
  - 事務本部
  what: 議論の過程や決め方、お金の使い道まで公開し、サポーターと一緒に伝える。法案の賛否を決める党内会議の公開（まる見えチャンネル）、OKRの公開、議員の調研費の公開もここに当たる。
  tools:
  - みらい まる見え政治資金
  - 公開OKR
  - アクションボード
  facts:
  - text: 2026-10-22 に「まる見え」宣言（党内会議・OKR・調研費の使い道・海外視察の報告と費用を公開）
    source:
      name: チームみらい公式サイト お知らせ一覧
      url: https://team-mir.ai/news/all
      checked: '2026-11-21'
  public_issues:
  - repo: team-mirai/marumie
    number: 1658
    title: 支払先が決まらなかった書類を、AIエージェントに解決させたい
    date: '2026-10-06'
    url: https://github.com/team-mirai/marumie/issues/1658
    checked: '2026-11-21'
  - repo: team-mirai/marumie
    number: 1903
    title: 公開済みの仕訳が1件も紐づかない支出群を、公開ページに出さない
    date: '2026-11-12'
    url: https://github.com/team-mirai/marumie/issues/1903
    checked: '2026-11-21'
  unknown:
  - 調研費の公開の運用（領収書の受け取りから公開まで）を、各議員室でどう回しているか
  stated_challenges:
  - text: まる見え政治資金は「現場にフィットしきっておらず、広く使われる姿にはなっていない」。「作ること」と「使われること」の間に大きな壁がある
    source: *id006
  - text: 党内のAIエージェント「みらいいぬ」はほぼ全員が毎日使うが、費用が大きく、安く使えるようにすることが課題
    source: *id006
- key: cycle
  tag: サイクルを回す
  title: 聴くから伝えるまでを一周させる
  officer: null
  units:
  - 広聴本部
  - 広報本部
  what: 聴く・磨く・動かす・伝えるを一つの論点で最後まで回しきり、その結果を評価する。
  tools: []
  facts:
  - text: 広聴・分析・党の議論と決定・国民への公表まで完了した論点（ループが閉じた論点）を5つつくることを目標にしている
    source:
      name: チームみらい OKR 広聴本部 O1（KR3）
      url: https://github.com/team-mirai/okr-content/blob/main/2026/q4/hq/kocho/o1.yml
      checked: '2026-11-24'
  public_issues: []
  unknown:
  - サイクルの評価指標（開発本部と策定する予定）
pipeline:
  title: 声が政策になるまで
  lead: 集めた声が論点になり、政務調査会に渡り、公表されるまでの各段階を、党が公開しているOKRの数字で並べた。
  nodes:
  - kr: kocho-o3-kr1
    label: 声を集める
    note: ツールで集めて公開した声
  - kr: kocho-o1-kr1
    label: 論点ごとに束ねる
    note: 1,000件以上の意見が集まった論点
  - kr: kocho-o1-kr2
    label: 政務調査会に渡す
    note: 結果と示唆を渡した政策論点
  - kr: kocho-o1-kr3
    label: 公表まで回しきる
    note: 聴くから公表まで完了した論点
  side:
  - kr: seicho-o2-kr2-2
    label: 重要法案をサイクルで扱う
  - kr: seicho-o1-kr1-1
    label: 全法案の賛否と根拠を公開
  - kr: giin-o1-kr1
    label: 各議員室で「政府を動かした」事例
