  profile: '衆議院議員 3期（東京26区：目黒区・大田区の一部）。早稲田大学理工学部卒。1967年、東京都大田区生まれ。福島県出身の父と長野県出身の母が営む町工場の三男として育つ。石川台ひかり幼稚園・大田区立雪谷小・中学校、早稲田高等学院を経て、早稲田大学理工学部（医療工学）卒業。松下政経塾（10期生）修了後、1993年に26歳で衆議院議員最年少当選。携帯電話の自由化やPL法（製造物責任法）の実現に尽力。2003年に2期目当選。東日本大震災では津波で親戚を多数失い、福島・いわきの復興支援に奔走。2026年に3期目当選。

    趣味はバドミントン、ウォーキング、ラグビーなどのスポーツ観戦。特技はけん玉。家族は妻と4人の子ども、そしてダックスフンド。'
