  catchphrase: 「届く」政治へ
  statement: 私は、行政と国民の間にある距離を縮めることが、政治の最重要課題の一つだと考えています。国民の声が行政に届かず、行政の支援や情報が国民に届かない。このギャップを埋め、必要な情報と支援が確実に届く仕組みをつくることが、暮らしの安心につながります。みんなの声を政策に変え、確実に届ける。その政治を実現するために、私は挑戦します。
  profile: 衆議院議員。チームみらい幹事長。2026年衆議院議員選挙にて当選。1991年生まれ、佐賀県出身。久留米大学附設高校、東京大学法学部、同公共政策大学院卒業。厚生労働省で介護保険制度改正や新型コロナ対応、医療系ベンチャー支援などに携わった後、UCバークレー情報大学院にてデータサイエンスを専攻し、情報マネジメント学修士号を取得。米国金融機関、シリコンバレーのスタートアップ企業でエンジニアとしての勤務を経て、2025年参議院選挙では福岡県選挙区にて立候補。その後はチームみらい党首安野貴博の秘書として国会活動・政策立案を支援した。
