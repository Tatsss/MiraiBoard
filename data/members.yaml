  statement: 目先の政局ではなくしっかりと未来を見据え、次の世代に安心して残せる社会に向けて前進しつづけることが大切です。日本には経済の停滞、人口減少といった社会全体の課題もあれば政治不信の問題もあります。これらの課題についてチームみらいは手を動かしひとつひとつ解決していきます。
  profile: 衆議院議員。2026年衆議院議員選挙にて東京7区（港区・渋谷区）で落選するも、比例東京ブロックより復活当選。1990年生まれ、東京都出身。開成高校、東京大学法学部を卒業後、ロンドン・ビジネス・スクールにてMBAを取得。米系金融機関であるゴールドマン・サックスを経て、スタートアップの取締役CFOを務める。その後、IT上場企業であるマネーフォワードにおいて執行役員及びグループ会社取締役を務め、国内企業のバックオフィスDXを支援。2025年、チームみらいの結党直後に参加。一児の父。
