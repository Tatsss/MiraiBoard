- id: FpXTdrjxsOYL
  title: サポーターコミュニケーション担当／イベント企画・運営担当
  department: 組織活動本部
  overview:
  - チームみらいの組織活動本部は、サポーターの皆さまをはじめ広く市民を巻き込みながら、デジタル民主主義の実践者と実践の場を社会に増やすことを目的に活動しています。いわば30000人のコミュニティをもとに社会を動かすための仕組みづくりに取り組むチームです。
  - 本ページでは、サポーターの皆さまの活動を現場で支えるポジションを募集しています。サポーターの方とのコミュニケーションの伴走をしていただき、ひとり一人の熱量を形に変える仕事です。
  - 将来的には、チームのリードや本部のマネジメントを担っていただくことも期待しています。
  - 具体的には、以下のような役割をお任せします。
  - ◎サポーターコミュニケーション
  - 日常的にサポーターの皆さまと接点を持ち、一人ひとりの活動への意欲を高め、実際の行動につなげていただく役割です。例えば、以下の仕事を想定しています。
  - ・Slackやオープンチャットの状況の把握と、サポーターの皆さまとのコミュニケーション ・サポーターからのご質問・ご相談への対応
  - ・サポーターの活動状況や困りごとの把握
  - ・活動への参加の呼びかけ、サポーター同士の交流の促進
  - ・AIを活用したコミュニティ運営の効率化
  - ・グッズ販売・備品貸出などに関連する事務作業
  - 問い合わせに答えるだけではなく、こちらから声をかけ、サポーターの皆さまとの関係を能動的に育てていく役割を期待しています。
  must:
