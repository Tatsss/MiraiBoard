  title: オウンドメディアディレクター（動画・SNS）
  department: 広報本部
  overview:
  - オウンドメディアディレクター（動画・SNS）
  - チームみらいが自ら持つ発信チャネル（YouTube・各SNS・note・党サイト）の企画から公開までを統括し、政治の情報が届く量と質を引き上げていただきます。
  - 具体的には、以下のような業務をお任せします。
  - ・YouTube（長尺・ショート）の企画・制作進行・公開後の改善
  - ・各SNSアカウントの運用設計と、日々の発信の編成（何を、どの順で、どのチャネルで出すか）
  - ・政策・国会活動といった「わかりにくいもの」を、届く形のコンテンツに翻訳する設計
  - ・外部の制作パートナー・編集者・クリエイターのディレクションと品質管理
  - ・発信の成果（到達・視聴維持・流入）の測定と、次の企画への反映
  - ・記者会見の全文書き起こしなど、一次情報の公開オペレーションの維持・改善
  - チームみらいは「オープンにする」を価値観の一つに掲げており、発信は党の看板そのものです。決められた本数をこなす役割ではなく、何を出すべきかを自ら決め、政治と有権者の距離を縮めることに責任を持っていただきます。
