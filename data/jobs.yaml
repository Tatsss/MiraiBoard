  - オープン・コミュニケーション
  - オーナーシップ
  - 社会人経験3年以上
  - 生成AIへの興味・関心
  - 円滑なコミュニケーション力 ・テキストでも口頭でも、円滑で感じがよく、粘り強く正確なやりとりができる方
  - 企画から実行までやり切る力 ・イベントを自ら企画し、当日の運営までやり切った経験（規模・形式は問いません）
  - 関係者を巻き込む調整力 ・立場の異なる複数の関係者と調整しながら、準備を前に進められる方
