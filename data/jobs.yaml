- id: dPUBz1ZRPvpi
  title: 組織活動本部 マネージャー（次期 組織活動本部長候補）
  department: 組織活動本部
  overview:
  - チームみらいの組織活動本部は、サポーターの皆さまをはじめ広く市民を巻き込みながら、デジタル民主主義の実践者と実践の場を社会に増やすことを目的に活動しています。いわば30000人のコミュニティをもとに社会を動かすための仕組みづくりに取り組むチームです。
  - 本ポジションは、組織活動本部全体の戦略を立て、チームを率いて成果を出す責任者候補です。入職後は本部のマネージャーとして現本部長とともに本部を運営し、将来的には組織活動本部長として本部を率いていただくことを想定しています。
  - 具体的には、以下のような業務をお任せします。
  - ・組織活動本部の戦略立案、目標（OKR）の設定、進捗管理
  - ・サポーターコミュニティ（3万人）の活動・成果を最大化するための施策の設計と実行
  - ・サポーターを中心とした対外的に発するメッセージ設計・伝達
  - ・本部メンバーのマネジメントと組織づくり（採用・育成を含む）
  - ・AIを活用した、体験価値の最大化
  - 組織活動本部は、マネージャーのもとに、ルール・仕組みの整備担当、サポーターコミュニケーション担当、イベント企画・運営担当が連携しながら進むチームです。マネージャーをはじめ、いくつかのポジションは現在採用を進めており、新しく加わるメンバーとともにチームをつくっていく段階にあります。
  - チームみらいのサポーターは30000人のとても大きなコミュニティです。このコミュニティに働きかけながら、ともに大きなムーブメントを生んでいくことに挑戦できる無二の機会です。
  must:
  - ミッション・価値観への共感 ・「チームみらい」の価値観を理解し、体現できる方 ・手を動かす・分断を煽らない・誰かをおとしめない・オープンにする・何事も決めつけない
  - 管理職として成果をあげた実績 ・チームを率いて目標を設定し、他部門と調整しながら、達成した経験（業種・組織規模は問いません）
  - オーナーシップ ・ 領域を限定せず、チーム間で零れ落ちそうなタスクを自ら拾い、手を動かして完遂できる方
  - 発信力
  - AIネイティブな組織運営への感性 ・生成AIを日常的に業務で使いこなしている方 ・AIを前提に、仕事の進め方そのものを設計し直すことに意欲のある方
  welcome:
  - スタートアップフェーズの企業・組織での勤務経験
  - オンライン・オフラインのコミュニティ運営の経験
