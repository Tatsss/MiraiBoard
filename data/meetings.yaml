- date: '2026-09-12'
  kind: YouTube
  title: 永田町エンジニアチーム密着
  url: https://youtu.be/0wXNPd3e3fE
  people:
  - 党のエンジニアチーム
  points:
  - 永田町エンジニアチームは、党の中でソフトウェアを作り続けるエンジニアの集団。まる見え政治資金、みらいSNS（これから作る）、SNS投稿や動画編集のための内部ツールなどを作っている
  - 特別国会の閉会後、次の臨時国会まで約3か月の「外部の納期が少ない期間」に、何を仕込むかを合宿で決めた。月に1度、議員会館で顔を合わせる「開発Day」がある（ふだんはリモート）
  - 党内のAIエージェント「みらいいぬ」は、党の仕事をする人のほぼ全員が毎日使っている。費用が大きく、安く使えるようにすることが直近の大きなテーマ
  - 会議で「AIインタビューでこういう意見があった」という会話が普通にされるようになった一方、プロダクトの運営はやり方を変えないといけない、と振り返り
  - ある議員事務所で、法案の前提を生成AIで調べ、チームみらいらしい切り口を掛け合わせて国会での質問を作る試みはうまくいった。ただ、その進め方をほかの11の議員室に広げることはできなかった。理由として「プロダクトの仕様のまずさ」以上に「導入する動機を説明できなかった」こと、現場からは「手間とリスク」が大きく見えたことが挙げられた
  - まる見え政治資金についても「プロダクトだけで、ほかに影響を与える形で政治とカネの問題を解決するのは難しいと分かった」「現場にフィットしきっておらず、広く使われる姿にはなっていない」と振り返り。「作ること」と「使われること」の間に大きな壁がある、とナレーション
  - 議員や秘書が増え、党の中の「テックの色」が相対的に薄まったという問題意識。一人ひとりが影響力を広げることや、開発メンバーを増やすこと、業務のやり方そのものをシステムを前提に変えてもらうことが話された。臨時国会では「選択と集中」で、やるべきことを絞るのが次の課題
  - AIが進行役になる合意形成のワークショップを党内でテスト。AIがタスクを選び、実装し、本番に反映するまでを繰り返す「ループエンジニアリング」で内部ツールを作る例も紹介
  - 党の資産やノウハウをすべて公開し、誰でも「フォーク」できる政党を目指す、という考え方。エンジニアを募集中
