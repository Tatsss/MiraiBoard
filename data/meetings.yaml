- date: '2026-11-11'
  kind: YouTube
  title: 【国会DX】処理能力10倍へ！目指す5つの国会の姿と道筋
  url: https://youtu.be/s1TvO1hkQ3M
  people:
  - 武藤かず子
  - もう1人の議員（文字起こしからは特定できない）
  points:
  - 目標は「国会の処理能力を10倍に」。紙をなくすこと自体が目的ではなく、法律の総点検や新しい政策課題に国会の処理が追いついていないことが問題。声をじっくり聴く力と、素早く決める力の両方を高める
  - 国会にはまだ紙でしかできない仕事が多い。本会議場では紙の新聞は読めるがタブレットは使えない（委員会は令和6年から使える）。請願も紙の書面でしか受け付けられない
  - '目指す5つの国会の姿: ①質疑の最中にその場で関連情報を確かめられる（本会議でのタブレットと通信）②AIに「この法案はどう議論されたか」を尋ねられる（衆議院のサイトの文字コードを国際標準に、中継動画に発言ごとのURL）③紙と手間に縛られず声を届けられる（マイナンバーカードの電子署名による電子請願）④議場に来られない人も審議に加われる（出産・育児・介護・病気などの場合のオンライン参加。憲法の論点があり丁寧に）⑤立法府がAIを使いこなす（調査局・法制局での活用、条文の総点検）'
  - どれだけAIやデジタルを使っても、判断するのは有権者から責任を託された議員
  - 議院運営委員会の国会改革小委員会の提言をもとに、短期（本会議でのタブレット利用、議員のPC・タブレット持ち込み、予算委員会の大型モニターでの残り時間表示）と中期（資料の公開、海外からのオンライン答弁など）に分けて提案。各党の議論は前向き
  source:
    name: YouTube「【国会DX】処理能力10倍へ！紙をなくすだけじゃない？目指す5つの国会の姿と道筋」（2026-11-11。文字起こしで確認）
    url: https://youtu.be/s1TvO1hkQ3M
    checked: '2026-11-25'
- date: '2026-10-26'
  kind: YouTube
  title: '緊急配信: AI失業対策提言「AIの社会実装と仕事・雇用の変化への備えに向けた提言」解説'
  url: https://youtu.be/zWKFdgUyFL0
  people:
  - 安野貴博
  - 高山聡史
  - 古川あおい
  points:
  - 10月26日の朝、官房長官と総理補佐官にAI失業対策の提言書を手渡した。表紙は、内容がひと目で分かるよう党のデザイナーがデザイン
  - メッセージは「AI失業は遠い未来の話ではない」。AI産業革命の恩恵を社会に広げつつ、失業のショックに社会全体で備える、という二本立て
  - '提言1「AIの変化に先回りして制度を整える」: 省庁の壁を越えて規制のボトルネックを把握する／技術の実用化の前から、シミュレーションなども使った評価の方法を整える／法令の点検にもAIを使い、制度の「バグ」を見つけて直す（法律のリファクタリング）'
  - '提言2「仕事の変化を捉えて働く人を支援する」: AI失業の兆しをいち早く察知する（労働統計にはまだ表れていないが、現場では採用停止などの声がある）／一人ひとりの学び直しとキャリアを支える／急な収入減に、行政の側から情報を届けるプッシュ型の支援'
  - '作り方: 8〜9月に米国・中国・フランスで現地調査、AIインタビューで582人の声、9〜10月に提言を作成、10月26日に提出とウェブサイト公開。同日からAIインタビュー第2弾を開始。臨時国会では高山聡史が内閣委員会、古川あおいが厚生労働委員会で取り上げる'
  - AIインタビューで寄せられたアイデアを盛り込んだり、いったん入れたものを外したりした。サポーターのSlackでは、提言のベータ版をGoogleドキュメントで共有し、コメントをもらう取り組みも始めている
  source:
