- date: '2026-11-13'
  kind: note
  title: 発足から2ヶ月 広聴本部に寄せられた『声』に答えます！
  url: https://note.com/team_mirai_jp/n/nab7280f54ae4
  people:
  - 広聴本部
  points:
  - AIインタビューは10分ほどで答えられ、声はすぐに議員や政策チームに届く。集まった声はAIがすぐに要約して論点ごとに整理し、人はそれを手がかりに一つひとつの声にも目を通して、どう解釈し、検討に生かし、国に届けるかを考える
  - 寄せられた声で多かったのは「届けた声の『その後』を見せてほしい」。答えとして、この秋に試した2つの取り組みを紹介
  - '選挙中のSNSデマ対策: 145人の声を聴いて9本の提案にまとめ、うち8本がさまざまな形で国の指針案に反映（声を聴き始めて約1か月）。反映されなかった提案と、必要と考える理由も公開'
  - 'AI時代のサイバー対策: 1,500人を超える声を聴いて7項目の提言にまとめ、10月23日にデジタル大臣に手交。11月6日に政府が示した緊急対策パッケージに、提言と同じ方向の施策が入った'
  - 'これから: ほかのテーマでも声のゆくえを公開したい。いずれは、荷物の配送状況のように、自分の声がいまどの段階（聴いている・論点にまとめている・議論に届いた・結果が出た）にあるかをたどれる形を目指す（機能はイメージで、実装予定・内容は未定）'
  - 「入口が見つからない・答えにくい」「支持者やデジタルに慣れた人に偏るのでは」という声も届いた。インタビュー一覧、SNSでの入口や広告での案内、全国キャラバンでの体験、音声での回答、選択肢の追加で対応
  - 11月から、サポーターが自分でテーマを立ててAIインタビューをつくれる仕組みを用意。困りごとや提案を一つの入口で受け止め、適切な場所を案内する仕組みも準備中
  - 声を分析するときは「数」ではなく「幅」に注目している（同じ反対でも理由の違い、少数でも大事な視点）
  source:
    name: note「発足から2ヶ月 広聴本部に寄せられた『声』に答えます！」（2026-11-13）
    url: https://note.com/team_mirai_jp/n/nab7280f54ae4
    checked: '2026-11-25'
- date: '2026-10-06'
  kind: YouTube
  title: 【新設】はじめまして！広聴本部です｜AIインタビュー実演と「Plan C」の生まれ方
  url: https://youtu.be/4ytOt_jDn7A
  people:
  - 広聴本部長 加藤直樹
  - 広聴本部のメンバー
  points:
  - 広聴本部は2026年9月17日に新設。メンバーは全員が党職員で、議員はいない（今期）
  - これまで「聴く」仕事は開発・広報・政調などに散らばっていた。デジタル民主主義サイクル（聴く・磨く・動かす・伝える）のうち、「聴く」を担う部署がなかったので立ち上げた
  - 政治の3つの「分からない」（国会や政党が何をしているか／どこに声を届ければいいか／届けた声がどうなったか）を解くのが役目
  - 'AIインタビューの実演（テーマ: 子どもとSNS）。みらい議会の解説ページから入り、立場を答えたあと、AIが理由や具体を深掘りする。論点は事前にAIへ入れてあり、プロンプトは公開。最後にAIがレポートを作り、本人が確認して提出する。公開するかどうかを選べる。音声でも答えられる'
  - このテーマでは219人が最後まで答え、549件の具体的な意見が集まった。論点は11個。最多は「年齢でSNSを制限すべきか」（121件）で、意見は「年齢で禁止」「段階的に広げる」「一律の制限はしない」の3つに分かれた。立場が違っても「抜け道が出る」「急な解禁は危ない」「使う前に学ぶ機会を」という心配は共通していた
  - '第3の案「Plan C」: 争点を「何歳から持てるか」から「年齢ごとに何ができるか」に変える案。549件の意見に照らすと、乗れそうな声182件・条件付き57件・ぶつかる声24件（推定）。次は、この案を答えた人に見せてもう一度聴く、という往復を考えている'
  - 広聴本部は、声を政策の議論にそのまま使えるところまで整理し、Plan C のたたき台やヒントを出して、政策をつくるチームに渡す。政策チームが専門的な検討を重ねて具体案にする
  - '分析はまだ見本の段階で、仕組みは開発中と説明。これから作るもの: AIインタビューの本数と質を増やす、意見の分かれ方と両側が乗れる案の候補が見えるツール、AIが進行役になる少人数のワークショップ、取り組みがうまくいっているかを測る物差し。作ったツールはデジタル公共財として公開する'
  source:
    name: YouTube「【新設】はじめまして！広聴本部です｜AIインタビュー実演と「Plan C」の生まれ方、目指す新しい民主主義の形」（2026-10-06。文字起こしで確認）
    url: https://youtu.be/4ytOt_jDn7A
    checked: '2026-11-25'
- date: '2026-09-12'
  kind: YouTube
  title: 永田町エンジニアチーム密着
  url: https://youtu.be/0wXNPd3e3fE
  people:
  - 党のエンジニアチーム
  points:
  - 永田町エンジニアチームは、党の中でソフトウェアを作り続けるエンジニアの集団。まる見え政治資金、みらいSNS（これから作る）、SNS投稿や動画編集のための内部ツールなどを作っている
  - 特別国会の閉会後、次の臨時国会まで約3か月の「外部の納期が少ない期間」に、何を仕込むかを合宿で決めた。月に1度、議員会館で顔を合わせる「開発Day」がある（ふだんはリモート）
  - 党内のAIエージェント「みらいいぬ」は、党の仕事をする人のほぼ全員が毎日使っている。費用が大きく、安く使えるようにすることが直近の大きなテーマ
  - 会議で「AIインタビューでこういう意見があった」という会話が普通にされるようになった一方、プロダクトの運営はやり方を変えないといけない、と振り返り
  - ある議員事務所で、法案の前提を生成AIで調べ、チームみらいらしい切り口を掛け合わせて国会での質問を作る試みはうまくいった。ただ、その進め方をほかの11の議員室に広げることはできなかった。理由として「プロダクトの仕様のまずさ」以上に「導入する動機を説明できなかった」こと、現場からは「手間とリスク」が大きく見えたことが挙げられた
  - まる見え政治資金についても「プロダクトだけで、ほかに影響を与える形で政治とカネの問題を解決するのは難しいと分かった」「現場にフィットしきっておらず、広く使われる姿にはなっていない」と振り返り。「作ること」と「使われること」の間に大きな壁がある、とナレーション
  - 議員や秘書が増え、党の中の「テックの色」が相対的に薄まったという問題意識。一人ひとりが影響力を広げることや、開発メンバーを増やすこと、業務のやり方そのものをシステムを前提に変えてもらうことが話された。臨時国会では「選択と集中」で、やるべきことを絞るのが次の課題
  - AIが進行役になる合意形成のワークショップを党内でテスト。AIがタスクを選び、実装し、本番に反映するまでを繰り返す「ループエンジニアリング」で内部ツールを作る例も紹介
  - 党の資産やノウハウをすべて公開し、誰でも「フォーク」できる政党を目指す、という考え方。エンジニアを募集中
  source:
    name: YouTube「永田町エンジニアチーム密着」（2026-09-12。文字起こしで確認）
