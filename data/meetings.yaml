how_to: YouTube の動画や note の記事から、何が語られ、何が決まった／決まらなかったかの要点だけを載せる。文字起こしにない発言は補わない。自動の文字起こしで聞き取れない部分（人名や数字）は「不明」とし、載せない。全文はこのリポジトリに置かない
meetings:
- date: '2026-11-13'
  kind: YouTube
  title: 定例会見（幹事長・古川あおい）
  url: https://note.com/team_mirai_jp/n/n3fd703c9d2a6
  people:
  - 古川あおい
  points:
  - AIサイバー対策の緊急提言のウェブサイトを11月12日に更新し、バージョン2.0として公開。11月6日に政府が出したサイバーセキュリティ緊急対策パッケージには、提言した22項目のうち14項目と重なる施策が入った
  - '国会での質疑: 10月23日 経済産業委員会で小林修平が、情報漏洩を正直に報告した企業が不利益を受けない仕組みを求めた（大臣は新たな検討課題との認識）。11月11日 内閣委員会で高山聡史が「官民サイバー救援隊」などを質問（大臣・副大臣から提言を「大変参考にさせていただいた」との答弁）。同日、林拓海が厚生労働委員会で医療機関のサイバー対策を取り上げた。11月10日 参議院総務委員会で安野貴博が、AIが自らの判断でシステムを攻撃した海外の事案を取り上げた'
  - '法案への態度: 消費税・支援金法案には反対（期間限定の食料品の減税ではなく、給付一本化を主張）。衆議院の定数削減法案は、比例定数の削減に反対を表明してきており、提出された法案は内容を確認して判断。政治資金では、6月12日に参政党と共同提出した法案（企業・団体献金とパーティー券購入の全面禁止）が審議予定'
  - '国会改革: 衆議院の国会改革小委員会で、本会議でのタブレット利用と、質疑時間のモニター表示に賛同。タブレットの試行結果の評価・公表、発言時間を傍聴者や中継の視聴者にも見えるようにすることも提案'
  - '記者の質問に答えて: OKRにある「次の国政選挙に立つ可能性のある人を20人採用する」は、選挙のときに「はじめまして」になるより、一定期間一緒に働いた人の方がお互いに良いという考えから。20という数は前回の衆院選の候補者数（14〜15名）を踏まえたもの。人数は党内の意向調査で把握しており、属性や配置は未定'
  source:
