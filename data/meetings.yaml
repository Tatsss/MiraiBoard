- date: '2026-10-19'
  kind: YouTube（まる見えチャンネル）
  title: 執行役員会・法案賛否決定MTG 10月19日
  url: null
  people:
  - 河合道雄
  - 安野貴博
  - 古川あおい
  - 峰島侑也
  - 村井謙太
  - 高山聡史
  points:
  - '進め方: 前段の法案賛否ミーティングの議論を踏まえ、政務調査会長（河合道雄）が賛否の案と理由を持ってきて、執行役員会で議論する。最後に政務調査会長が、みらい議会に載せる賛否の理由をまとめる'
  - 扱った7法案（一般職・特別職・裁判官・検察官・防衛省職員の給与、国家公務員の災害補償、公立学校医などの公務災害補償）は、すべて賛成で結論
  - '議論になった点: 特別職の給与の法案で、閣僚分の給与を支給しない扱いが据え置かれていた（前年はこれを理由に反対）。「異常性が高いので改めて反対を示すべき」という意見と、「今回の改正の範囲外の論点で反対すると、ほかの法案でも交渉材料にする方向に進んでしまう」「プルリクエストの感覚では、別の論点は別に扱うべき」という意見が出た。結論は賛成とし、みらい議会では懸念を引き続き明示する'
  - '会議のやり方の改善: 全文を読み上げるより、各自が読む時間を取る方が効率的。意見を事前に書き込める欄（異議なし／意見あり、名前）を作る'
  - '道具の話: 男女で扱いが違う規定がほかの法律にも残っていないか、全法令をスキャンしてリストにしたい（まだ進んでいない）。役所では関係する法律の改正漏れをキーワード検索で洗い出しているので、AIで全体をスキャンし、言葉が違っても同じ意味の規定を拾って、国会質疑や配布資料で示せると良い'
  - 防衛省のサイバー人材の給与水準の課題は、法案には賛成しつつ、安全保障委員会の質疑で確認していく
  source:
