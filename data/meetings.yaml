    checked: '2026-11-25'
- date: '2026-10-06'
  kind: YouTube
  title: 【新設】はじめまして！広聴本部です｜AIインタビュー実演と「Plan C」の生まれ方
  url: https://youtu.be/4ytOt_jDn7A
  people:
  - 広聴本部長 加藤直樹
  - 広聴本部のメンバー
  points:
  - 広聴本部は2026年9月17日に新設。メンバーは全員が党職員で、議員はいない（今期）
  - これまで「聴く」仕事は開発・広報・政調などに散らばっていた。デジタル民主主義サイクル（聴く・磨く・動かす・伝える）のうち、「聴く」を担う部署がなかったので立ち上げた
  - 政治の3つの「分からない」（国会や政党が何をしているか／どこに声を届ければいいか／届けた声がどうなったか）を解くのが役目
  - 'AIインタビューの実演（テーマ: 子どもとSNS）。みらい議会の解説ページから入り、立場を答えたあと、AIが理由や具体を深掘りする。論点は事前にAIへ入れてあり、プロンプトは公開。最後にAIがレポートを作り、本人が確認して提出する。公開するかどうかを選べる。音声でも答えられる'
  - このテーマでは219人が最後まで答え、549件の具体的な意見が集まった。論点は11個。最多は「年齢でSNSを制限すべきか」（121件）で、意見は「年齢で禁止」「段階的に広げる」「一律の制限はしない」の3つに分かれた。立場が違っても「抜け道が出る」「急な解禁は危ない」「使う前に学ぶ機会を」という心配は共通していた
  - '第3の案「Plan C」: 争点を「何歳から持てるか」から「年齢ごとに何ができるか」に変える案。549件の意見に照らすと、乗れそうな声182件・条件付き57件・ぶつかる声24件（推定）。次は、この案を答えた人に見せてもう一度聴く、という往復を考えている'
  - 広聴本部は、声を政策の議論にそのまま使えるところまで整理し、Plan C のたたき台やヒントを出して、政策をつくるチームに渡す。政策チームが専門的な検討を重ねて具体案にする
  - '分析はまだ見本の段階で、仕組みは開発中と説明。これから作るもの: AIインタビューの本数と質を増やす、意見の分かれ方と両側が乗れる案の候補が見えるツール、AIが進行役になる少人数のワークショップ、取り組みがうまくいっているかを測る物差し。作ったツールはデジタル公共財として公開する'
  source:
    name: YouTube「【新設】はじめまして！広聴本部です｜AIインタビュー実演と「Plan C」の生まれ方、目指す新しい民主主義の形」（2026-10-06。文字起こしで確認）
