- date: 不明
  kind: YouTube
  title: 【本人解説】国会対策委員会と政務調査会の役割とは？
  url: null
  people:
  - 須田英太郎
  - 峰島侑也
  points:
  - 動画の中で、須田英太郎が国会対策委員長に、峰島侑也が政務調査会に就いたと報告している（議席が「まだ1つ」と話しており、現在の体制とは異なる。現在の役職は各議員のプロフィールを参照）
  - '国会対策委員会: 国会でどの議案を、いつ、どの委員会で、どの順番で話すかを、各党が事前に話し合って段取りをつける。限られた国会の時間で議論を前に進めるための仕事。党の主張が通るよう、他党と連携・交渉する'
  - '政務調査会: 政策をリードするチーム。マニフェストをもとに、これから掲げる政策や、いまの政策の見直しを考える。他党や政府が出した法案に賛成か反対か、その理由も含めて党のスタンスを決める'
  - 国会対策委員会に入ってくる国会の日程や議題の情報をもとに、政務調査会と一緒に、賛否やその理由、発言を考える。2つはとても強く連携する必要がある
  - 少数政党なので、他党との連携と、政策を発信して世論や他党に「いいね」と思ってもらうことが大事。しがらみが少ないことを強みに、ゼロベースで政策を考えたい
